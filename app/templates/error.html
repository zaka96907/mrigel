{% extends "document.html" %}
{% from "macros.html" import logo %}
{% block title %}{{ t('error_title') }} — Mrigel{% endblock %}
{% block body %}
<main id="main" class="auth-main" style="min-height: 100vh">
  <div class="auth-card" style="text-align: center; align-items: center">
    <div class="stamp is-cancelled" style="position: relative; inset: auto; top: auto" aria-hidden="true"><div><b class="num">{{ code }}</b></div></div>
    <h1>{{ t('error_title') }}</h1>
    <p class="muted">{{ t(message_key) }}</p>
    <a class="btn btn-primary" href="/">{{ t('go_home') }}</a>
  </div>
</main>
{% endblock %}

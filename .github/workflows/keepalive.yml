# Render's free plan puts the server to sleep after 15 minutes without a visit. Asleep, it does not
# send the queued WhatsApp messages or the follow-ups, and the next visitor waits about a minute.
# This job visits the site every 10 minutes so it stays awake (one free service fits in Render's
# 750 free hours a month). Change the address if your site moves.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the site
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 90 "https://mrigel.onrender.com/health" && exit 0
            sleep 20
          done
          echo "site did not answer" && exit 1

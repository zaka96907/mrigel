# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: mrigel
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_COOKIES
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DEMO_MODE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: mrigel-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      # lets you set a new password for a merchant who lost theirs, at /admin/reset
      - key: ADMIN_TOKEN
        generateValue: true
      # shown on the help, privacy and terms pages as the way to reach you
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_WHATSAPP
        sync: false
databases:
  - name: mrigel-db
    plan: free

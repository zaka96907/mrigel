# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: mrigel
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_COOKIES
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DEMO_MODE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: mrigel-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
databases:
  - name: mrigel-db
    plan: free
